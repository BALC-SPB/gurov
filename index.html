<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Favicon -->
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">

<!-- Open Graph (заголовок и описание подставятся из data.js) -->
<meta property="og:type" content="website">
<meta property="og:image" content="logo.png">
<meta name="twitter:card" content="summary_large_image">

<!-- Заголовок (перезапишется скриптом) -->
<title>Визитка</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; min-height:100%; }
  body {
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#050a14;
    padding:24px 16px;
    color:#e8eef7;
    overflow-x:hidden;
    position:relative;
  }

  /* ===== ПРЕМИАЛЬНЫЙ ФОН ===== */
  .bg-layer {
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background:
      radial-gradient(1200px 700px at 15% 10%, rgba(25,80,180,.25), transparent 60%),
      radial-gradient(1000px 600px at 90% 90%, rgba(0,180,255,.15), transparent 60%),
      radial-gradient(800px 500px at 50% 50%, rgba(10,40,90,.4), transparent 70%),
      #050a14;
  }

  .aurora {
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:.5;
    pointer-events:none;
  }
  .a1 { width:600px; height:400px; top:-10%; left:-10%; background:radial-gradient(circle, #1e6bff, transparent 70%); animation:auroraMove 18s ease-in-out infinite; }
  .a2 { width:500px; height:400px; bottom:-15%; right:-10%; background:radial-gradient(circle, #00d4ff, transparent 70%); animation:auroraMove 22s ease-in-out infinite reverse; }
  .a3 { width:400px; height:300px; top:40%; left:40%; background:radial-gradient(circle, #6a5cff, transparent 70%); opacity:.25; animation:auroraMove 26s ease-in-out infinite; }
  @keyframes auroraMove {
    0%,100% { transform:translate(0,0) scale(1); }
    50%     { transform:translate(60px,-40px) scale(1.15); }
  }

  #logistics-canvas {
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
    opacity:.9;
  }

  .grid-overlay {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(80,140,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(80,140,255,.04) 1px, transparent 1px);
    background-size:60px 60px;
    pointer-events:none;
    mask-image:radial-gradient(ellipse at center, black 30%, transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse at center, black 30%, transparent 80%);
  }

  /* ===== КАРТОЧКА ===== */
  .card {
    position:relative; z-index:2;
    width:100%; max-width:460px;
    background:rgba(10,18,34,0.72);
    backdrop-filter:blur(24px) saturate(140%);
    -webkit-backdrop-filter:blur(24px) saturate(140%);
    border:1px solid rgba(120,180,255,0.22);
    border-radius:28px;
    padding:44px 34px 34px;
    text-align:center;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.7),
      0 0 0 1px rgba(255,255,255,0.02) inset,
      0 1px 0 rgba(255,255,255,0.08) inset;
    animation:cardIn .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(40px) scale(.97); }
    to   { opacity:1; transform:none; }
  }
  .card::before {
    content:''; position:absolute; inset:-1px;
    border-radius:29px; padding:1px;
    background:linear-gradient(135deg, rgba(25,198,255,.7), rgba(47,124,246,.1), rgba(25,198,255,.5));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:.6; pointer-events:none;
  }

  .logo {
    width:112px; height:112px; margin:0 auto 22px;
    border-radius:50%;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    padding:10px;
    box-shadow:0 0 0 4px rgba(47,124,246,0.18), 0 12px 30px rgba(25,198,255,0.4);
    animation:logoPulse 4s ease-in-out infinite;
  }
  @keyframes logoPulse {
    0%,100% { box-shadow:0 0 0 4px rgba(47,124,246,0.18), 0 12px 30px rgba(25,198,255,0.35); }
    50%     { box-shadow:0 0 0 10px rgba(47,124,246,0.08), 0 16px 40px rgba(25,198,255,0.55); }
  }
  .logo img { max-width:100%; max-height:100%; object-fit:contain; }

  h1 { font-size:25px; font-weight:800; letter-spacing:-0.3px; animation:fadeUp .7s .15s both; }
  .position {
    font-size:13px; color:#8fc0ff; font-weight:600;
    margin-top:8px; text-transform:uppercase; letter-spacing:1.6px;
    animation:fadeUp .7s .25s both;
  }
  .company {
    font-size:15px; color:#c8d6e8; margin-top:14px; line-height:1.5;
    animation:fadeUp .7s .35s both;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(14px); }
    to   { opacity:1; transform:none; }
  }

  .divider {
    height:1px; margin:24px 0;
    background:linear-gradient(90deg,transparent,rgba(120,180,255,0.45),transparent);
    animation:fadeUp .7s .45s both;
  }

  .desc {
    font-size:13.5px; line-height:1.7; color:#a8b8d0;
    margin-bottom:26px;
    animation:fadeUp .7s .5s both;
  }

  .contact {
    display:flex; align-items:center; gap:14px;
    padding:14px 18px; margin-bottom:12px;
    background:rgba(255,255,255,0.035);
    border:1px solid rgba(120,180,255,0.12);
    border-radius:16px; text-decoration:none; color:#e8eef7;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), background .3s, border-color .3s, box-shadow .3s;
    text-align:left;
    animation:fadeUp .7s both;
  }
  .contact:nth-of-type(1) { animation-delay:.55s; }
  .contact:nth-of-type(2) { animation-delay:.62s; }
  .contact:nth-of-type(3) { animation-delay:.69s; }
  .contact:nth-of-type(4) { animation-delay:.76s; }

  .contact:hover {
    background:rgba(47,124,246,0.15);
    border-color:rgba(47,124,246,0.55);
    transform:translateX(6px) scale(1.015);
    box-shadow:0 8px 24px rgba(47,124,246,0.25);
  }
  .contact .ico {
    width:40px; height:40px; flex-shrink:0;
    border-radius:12px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,rgba(47,124,246,0.25),rgba(25,198,255,0.15));
    font-size:18px;
    transition:transform .3s;
  }
  .contact:hover .ico { transform:scale(1.08) rotate(-4deg); }
  .contact .lbl { font-size:11px; color:#8fa6c2; text-transform:uppercase; letter-spacing:.8px; }
  .contact .val { font-size:14.5px; font-weight:600; margin-top:2px; }

  .qr-block {
    margin-top:22px; padding:20px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(120,180,255,0.12);
    border-radius:16px;
    animation:fadeUp .7s .85s both;
  }
  .qr-block .qr-title {
    font-size:12px; color:#8fc0ff;
    text-transform:uppercase; letter-spacing:1.2px; margin-bottom:12px;
  }
  .qr-block img {
    width:180px; height:180px; object-fit:contain;
    border-radius:12px; background:#fff; padding:8px;
    display:block; margin:0 auto;
    transition:transform .3s;
  }
  .qr-block img:hover { transform:scale(1.03); }
  .qr-block .qr-hint { font-size:11px; color:#8fa6c2; margin-top:10px; }

  .save-btn {
    display:block; width:100%; margin-top:24px; padding:15px;
    border:none; border-radius:16px; cursor:pointer;
    font-family:'Inter',sans-serif; font-size:15px; font-weight:700;
    color:#fff; background:linear-gradient(135deg,#2f7cf6,#19c6ff);
    box-shadow:0 12px 30px rgba(47,124,246,0.4);
    transition:transform .25s, box-shadow .25s;
    animation:fadeUp .7s .9s both;
    position:relative; overflow:hidden;
  }
  .save-btn:hover { transform:translateY(-3px); box-shadow:0 18px 42px rgba(47,124,246,0.6); }
  .save-btn:active { transform:translateY(-1px) scale(.99); }
  .save-btn::after {
    content:''; position:absolute; top:0; left:-120%; width:60%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    transform:skewX(-20deg);
    animation:shine 3.5s ease-in-out infinite;
  }
  @keyframes shine {
    0%   { left:-120%; }
    60%  { left:140%; }
    100% { left:140%; }
  }

  .share-btn {
    display:block; width:100%; margin-top:12px; padding:14px;
    border:1px solid rgba(120,180,255,0.3); border-radius:16px; cursor:pointer;
    font-family:'Inter',sans-serif; font-size:14px; font-weight:600;
    color:#c8d6e8; background:rgba(255,255,255,0.03);
    transition:transform .25s, background .25s, border-color .25s;
    animation:fadeUp .7s .95s both;
  }
  .share-btn:hover {
    transform:translateY(-2px);
    background:rgba(47,124,246,0.12);
    border-color:rgba(47,124,246,0.55);
  }

  .footer {
    margin-top:22px; font-size:11px; color:#7a8fa8; letter-spacing:.5px;
    animation:fadeUp .7s 1s both;
  }

  @media (max-width: 480px) {
    .card { padding:36px 22px 28px; border-radius:24px; }
    h1 { font-size:22px; }
    .logo { width:96px; height:96px; }
    .qr-block img { width:150px; height:150px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .card *, .save-btn, .share-btn { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- Фон -->
<div class="bg-layer" aria-hidden="true">
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <div class="aurora a3"></div>
  <canvas id="logistics-canvas"></canvas>
  <div class="grid-overlay"></div>
</div>

<div class="card">
  <div class="logo">
    <img src="logo.png" alt="Логотип" id="logoImg">
  </div>

  <h1 id="empName">—</h1>
  <div class="position" id="empPosition">—</div>
  <div class="company" id="empCompany">—</div>

  <div class="divider"></div>
  <p class="desc" id="empDescription">—</p>

  <a class="contact" id="phoneLink" href="#">
    <div class="ico">📞</div>
    <div><div class="lbl">Телефон</div><div class="val" id="phoneText">—</div></div>
  </a>
  <a class="contact" id="emailLink" href="#">
    <div class="ico">✉️</div>
    <div><div class="lbl">Email</div><div class="val" id="emailText">—</div></div>
  </a>
  <a class="contact" id="siteLink" href="#" target="_blank" rel="noopener">
    <div class="ico">🌐</div>
    <div><div class="lbl">Сайт</div><div class="val" id="siteText">—</div></div>
  </a>
  <a class="contact" id="maxLink" href="#" target="_blank" rel="noopener">
    <div class="ico" style="background: linear-gradient(135deg, #00BFFF, #9500FF); padding: 9px;">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
        <path d="M12 3C7.03 3 3 6.58 3 11C3 13.48 4.34 15.68 6.42 17.05L5.5 21L9.78 18.86C10.5 18.95 11.24 19 12 19C16.97 19 21 15.42 21 11C21 6.58 16.97 3 12 3Z" fill="white"/>
      </svg>
    </div>
    <div><div class="lbl">MAX</div><div class="val">Написать в MAX</div></div>
  </a>

  <div class="qr-block">
    <div class="qr-title">WeChat</div>
    <img id="wechatImg" src="wechat.png" alt="QR-код WeChat">
    <div class="qr-hint">Отсканируйте в WeChat, чтобы добавить контакт</div>
  </div>

  <button class="save-btn" onclick="downloadVCF()">📥 Сохранить контакт</button>
  <button class="share-btn" onclick="shareCard()" id="shareBtn">🔗 Поделиться визиткой</button>

  <div class="footer" id="footer">—</div>
</div>

<!-- Фоновая анимация -->
<script src="logistics-bg.js"></script>

<!-- Данные сотрудника -->
<script src="data.js"></script>
<script>
function fillCard() {
  document.getElementById('empName').textContent = EMPLOYEE.name;
  document.getElementById('empPosition').textContent = EMPLOYEE.position;
  document.getElementById('empCompany').innerHTML = EMPLOYEE.company + '<br><br>' + EMPLOYEE.slogan;
  document.getElementById('empDescription').textContent = EMPLOYEE.description;

  const phoneLink = document.getElementById('phoneLink');
  phoneLink.href = 'tel:' + EMPLOYEE.phoneRaw;
  document.getElementById('phoneText').textContent = EMPLOYEE.phone;

  const emailLink = document.getElementById('emailLink');
  emailLink.href = 'mailto:' + EMPLOYEE.email;
  document.getElementById('emailText').textContent = EMPLOYEE.email;

  const siteLink = document.getElementById('siteLink');
  siteLink.href = EMPLOYEE.website;
  document.getElementById('siteText').textContent = EMPLOYEE.websiteText;

  document.getElementById('maxLink').href = EMPLOYEE.maxLink;
  document.getElementById('wechatImg').src = EMPLOYEE.wechatQR;

  document.getElementById('footer').textContent =
    'Балтийская Логистическая Компания · ' + EMPLOYEE.city;

  // Динамические мета-теги Open Graph
  const ogTitle = EMPLOYEE.name + ' — ' + EMPLOYEE.company;
  const ogDesc = EMPLOYEE.slogan;

  document.title = ogTitle;

  // Создаём теги, если их нет (их убрали из head)
  function ensureMeta(property, content) {
    let tag = document.querySelector(`meta[property="${property}"]`);
    if (!tag) {
      tag = document.createElement('meta');
      tag.setAttribute('property', property);
      document.head.appendChild(tag);
    }
    tag.setAttribute('content', content);
  }

  ensureMeta('og:title', ogTitle);
  ensureMeta('og:description', ogDesc);
}

function downloadVCF() {
  const parts = EMPLOYEE.name.split(' ');
  const vcf = `BEGIN:VCARD
VERSION:3.0
N:${parts[0]};${parts[1] || ''};${parts[2] || ''};;
FN:${EMPLOYEE.name}
ORG:${EMPLOYEE.company}
TITLE:${EMPLOYEE.position}
TEL;TYPE=CELL:${EMPLOYEE.phoneRaw}
EMAIL:${EMPLOYEE.email}
URL:${EMPLOYEE.website}
NOTE:${EMPLOYEE.vcfNote}
END:VCARD`;
  const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = EMPLOYEE.vcfFileName;
  a.click();
}

function shareCard() {
  const btn = document.getElementById('shareBtn');
  const url = location.href;
  if (navigator.share) {
    navigator.share({
      title: EMPLOYEE.name + ' — ' + EMPLOYEE.company,
      text: 'Электронная визитка: ' + EMPLOYEE.name,
      url: url
    }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => {
      btn.textContent = '✅ Ссылка скопирована!';
      setTimeout(() => { btn.textContent = '🔗 Поделиться визиткой'; }, 2500);
    });
  }
}

fillCard();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
